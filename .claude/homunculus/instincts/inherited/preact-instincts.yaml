# Preact Workflow Diff Module Implementation Update

## Action

Follow the diff-module-implementation-update workflow:
1. Edit one or more files in src/diff/ (such as apply.js, children.js, create.js, index.js, props.js, shared.js)
2. Optionally update related core files (e.g., src/component.js, src/render.js)
3. Optionally update or add tests in test/browser/

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/diff/apply.js, src/diff/children.js, src/diff/create.js

